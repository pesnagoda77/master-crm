name: master_crm
description: CRM для мастеров - учет времени, клиентов и финансов

publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # OCR для чтения чеков
  google_mlkit_text_recognition: ^0.14.0
  
  # База данных SQLite
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Управление состоянием
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Форматирование дат и чисел
  intl: any
  
  # Иконки и свайпы
  cupertino_icons: ^1.0.6
  flutter_slidable: ^3.0.1
  
  # Камера для фото чеков
  image_picker: ^1.1.2
  
  # Доступ к файловой системе для бэкапа
  path_provider: ^2.1.2

    # Доступ к контактам телефона
  flutter_contacts: ^1.1.9+2

  # Контакты и уведомления
  url_launcher: ^6.2.5
  flutter_local_notifications: ^17.0.0
  
  # Графики и PDF
  fl_chart: ^0.68.0
  pdf: ^3.10.7
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true