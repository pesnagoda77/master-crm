name: iOS build check

# Проверяем, что iOS-сборка компилируется (без подписи — для этого нужен только macOS-раннер).
# Запуск: вручную из вкладки Actions или при push в main.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Показать версию Flutter
        run: flutter --version
      - name: Зависимости
        run: flutter pub get
      - name: Сборка iOS без подписи
        run: flutter build ios --release --no-codesign
      - name: Отчёт о размере
        run: du -sh build/ios/iphoneos/Runner.app || true
